<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>击杀卡</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font: 16px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f0e8; color: #1d1a16; }
      #app { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { margin: 0 0 16px; font-size: 28px; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      h3 { margin: 12px 0 4px; font-size: 15px; }
      section { background: #fff; border: 1px solid #ddd4c4; padding: 16px; margin: 0 0 16px; }
      #app > section:focus-within { position: relative; z-index: 2; }
      .field { position: relative; display: grid; gap: 4px; margin: 0 0 12px; min-width: 0; }
      .field .name { font-weight: 600; }
      input[type="text"], select, button { font: inherit; padding: 6px 8px; box-sizing: border-box; max-width: 100%; }
      .field input[type="text"], .field select { width: 100%; min-width: 0; }
      .results {
        position: absolute;
        z-index: 5;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 240px;
        overflow: auto;
        background: #fff;
        border: 1px solid #ddd4c4;
        box-shadow: 0 8px 20px rgba(29, 26, 22, 0.12);
      }
      .results button {
        display: grid;
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #f3f0e8;
        background: transparent;
        cursor: pointer;
      }
      .results button[aria-selected="true"],
      .results button:hover { background: #efe6d4; }
      .results .hint { color: #5c564c; font-size: 13px; }
      .results .empty { margin: 0; padding: 6px 8px; color: #5c564c; }
      .planet-row { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; }
      .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; margin: 0 0 12px; }
      .checks label { display: flex; gap: 6px; align-items: center; }
      #card h2 { font-size: 22px; }
      @media (min-width: 960px) {
        #app {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          align-items: start;
          column-gap: 16px;
          max-width: 1200px;
        }
        #app > h1 { grid-column: 1 / -1; }
        #app > section:not(#card) { grid-column: 1; min-width: 0; }
        #card { grid-column: 2; grid-row: 2 / span 3; }
      }
      #unknown-hazards { margin: 8px 0 0; color: #6a4b16; }
      #planet-status { color: #5c564c; }
      a { color: #1d4e89; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
